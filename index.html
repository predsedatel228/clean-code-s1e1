<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix picture" class="header__image">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="top-section" class="top-section">
        <label for="new-task" class="top-section__add-label">Add Item</label>
        <div class="top-section__container">
          <input id="new-task"class="top-section__input" type="text">
          <button class="top-section__add-button">Add</button>
        </div>
      </section>
      <section class="todo-section">
        <h1 class="todo-section__heading">Todo</h1>
        <ul id="incomplete-tasks" class="todo-section__task-list">
          <li class="todo-section__task task">
            <input type="checkbox" class="task__checkbox">
            <label class="task__input label">Pay Bills</label>
            <input type="text" class="task__input input-text">
            <button class="task__edit">Edit</button>
            <button class="task__delete">
              <img src="./remove.svg" alt="remove icon" class="task__image">
            </button>
          </li>
          <li class="todo-section__task task task_edited">
            <input type="checkbox" class="task__checkbox">
            <label class="task__input label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task__input input-text">
            <button class="task__edit">Save</button>
            <button class="task__delete">
              <img src="./remove.svg" alt="remove icon" class="task__image">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed-section">
        <h2 class="completed-section__heading">Completed</h2>
        <ul id="completed-tasks" class="completed-section__task-list">
          <li class="completed-section__task task">
            <input type="checkbox" checked class="task__checkbox">
            <label class="task__input label">See the Doctor</label>
            <input type="text" class="task__input input-text">
            <button class="task__edit">Edit</button>
            <button class="task__delete">
              <img src="./remove.svg" alt="remove icon" class="task__image">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
